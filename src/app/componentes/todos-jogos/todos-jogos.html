<section class="todos-jogos">

    <p>Explore todos os clássicos de PlayStation 2 cadastrados.</p>
  </div>

  <div class="todos-jogos-lista">

      <app-jogo [jogo]="jogo"></app-jogo>
    }
  </div>
</section>
